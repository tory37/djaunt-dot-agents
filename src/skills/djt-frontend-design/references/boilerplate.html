<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Fidelity Artifact</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (UMD) — crossorigin is required or CORS silently breaks the mount -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel standalone — required to transpile the type="text/babel" block below -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide icons — use instead of emojis for all iconography -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: {
                        '72': '18rem', // cinematic section spacing beyond the default scale
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'monospace'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased selection:bg-white selection:text-black min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="w-full flex flex-col items-center justify-center p-4 md:p-8">
                    {/* Build the interface here, following the SKILL.md design plan and anti-slop constraints */}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
